name: Build & Test

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    needs: [build-test, lint]
    if: ${{ always() }}
    steps:
      - name: Require build, tests, and lint
        env:
          BUILD_TEST_RESULT: ${{ needs.build-test.result }}
          LINT_RESULT: ${{ needs.lint.result }}
        run: test "$BUILD_TEST_RESULT" = success && test "$LINT_RESULT" = success

  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          version: "2026.5.4"
          experimental: true

      - uses: ./.github/actions/cache-go

      - name: Check formatting
        run: mise run fmt-check

      - name: Validate release configuration
        run: mise run release-check

      - name: Test locked release tooling
        run: |
          npm ci --prefix release/tooling --ignore-scripts
          npm test --prefix release/tooling

      - name: Vet
        run: mise run vet

      - name: Build
        run: mise run build

      - name: Test
        run: mise run test-short

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          version: "2026.5.4"
          experimental: true

      - uses: ./.github/actions/cache-go

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/golangci-lint
          key: ${{ runner.os }}-${{ runner.arch }}-golangci-${{ hashFiles('mise.toml', '.golangci.yml', '**/go.mod', '**/go.sum', 'go*.work*') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-golangci-${{ hashFiles('mise.toml', '.golangci.yml', '**/go.mod', '**/go.sum', 'go*.work*') }}-

      - name: Lint
        env:
          GOLANGCI_LINT_CACHE: ${{ runner.temp }}/golangci-lint
        run: mise run lint

  race:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          version: "2026.5.4"
          experimental: true

      - uses: ./.github/actions/cache-go

      - name: Test with the race detector
        run: mise run test-race

  docs-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          version: "2026.5.4"
          experimental: true

      - name: Lint docs (structural + markdown style)
        run: mise run lint-docs

  module-resolution:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          version: "2026.5.4"
          experimental: true

      - uses: ./.github/actions/cache-go

      - name: Test module policy fixtures
        run: mise run test-module-policy

      - name: Test CI source and artifact gates
        run: mise run test-ci-workflow

      - name: Verify candidate Gateway workspace
        run: mise run verify-gateway-workspace

      - name: Verify AI Gateway module and license boundary
        run: mise run verify-ai-gateway-boundary

      - name: Verify merged internal module pins
        run: mise run verify-merged-pins

      - name: Verify SDK isolation from Gateway source
        run: mise run verify-sdk-gateway-isolation

  parity-baseline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          version: "2026.5.4"
          experimental: true

      - uses: ./.github/actions/cache-go

      - name: Validate parity baseline
        run: mise run validate-parity-baseline

      - name: Verify ProviderWire V4 contract
        run: mise run test-providerwire-v4

      - name: Fetch pinned upstream fixtures
        run: |
          commit=$(awk '/^  commit:/ { print $2 }' test/conformance/upstream.yaml)
          git init "$RUNNER_TEMP/vercel-ai"
          git -C "$RUNNER_TEMP/vercel-ai" remote add origin https://github.com/vercel/ai.git
          git -C "$RUNNER_TEMP/vercel-ai" fetch --depth=1 origin "$commit"

      - name: Validate parity coverage
        env:
          AI_SDK_UPSTREAM_ROOT: ${{ runner.temp }}/vercel-ai
        run: mise run parity-coverage

      - name: Report provider API shape parity
        run: mise run parity-provider-shape

  integration-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          version: "2026.5.4"
          experimental: true

      - uses: ./.github/actions/cache-go

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Integration tests
        run: mise run test-integration

  conformance-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          version: "2026.5.4"
          experimental: true

      - uses: ./.github/actions/cache-go

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Conformance tests
        id: conformance
        run: |
          set +e
          mise run test-conformance 2>&1 | tee conformance-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Conformance test summary
        if: always() && steps.conformance.outcome != 'skipped'
        run: |
          PASS=$(grep -c -e "--- PASS:.*/" conformance-output.txt 2>/dev/null || true)
          FAIL=$(grep -c -e "--- FAIL:.*/" conformance-output.txt 2>/dev/null || true)
          PASS=${PASS:-0}
          FAIL=${FAIL:-0}
          echo "## Conformance Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Result: ${PASS} passed, ${FAIL} failed**" >> "$GITHUB_STEP_SUMMARY"
          if [ "$FAIL" -gt 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -e "--- FAIL:.*/" conformance-output.txt >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "${{ steps.conformance.outputs.exit_code }}"
