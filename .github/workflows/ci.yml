name: Build & Test

on:
  push:
    branches: [main]
    tags: ['ai-gateway/v*']
  pull_request:

permissions: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          version: "2026.5.4"
          experimental: true

      - name: Resolve Go cache paths
        id: go-cache
        run: |
          echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
          path: |
            ${{ steps.go-cache.outputs.gocache }}
            ${{ steps.go-cache.outputs.gomodcache }}
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Check formatting
        run: mise run fmt-check

      - name: Vet
        run: mise run vet

      - name: Lint
        run: mise run lint

      - name: Build
        run: mise run build

      - name: Test
        run: mise run test-short

  docs-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          version: "2026.5.4"
          experimental: true

      - name: Lint docs (structural + markdown style)
        run: mise run lint-docs

  module-resolution:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          version: "2026.5.4"
          experimental: true

      - name: Verify published module requirements resolve
        run: mise run verify-module-resolution

      - name: Verify AI Gateway module and license boundary
        run: mise run verify-ai-gateway-boundary

  parity-baseline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          version: "2026.5.4"
          experimental: true

      - name: Validate parity baseline
        run: mise run validate-parity-baseline

      - name: Verify ProviderWire V4 contract
        run: mise run test-providerwire-v4

      - name: Fetch pinned upstream fixtures
        run: |
          commit=$(awk '/^  commit:/ { print $2 }' test/conformance/upstream.yaml)
          git init "$RUNNER_TEMP/vercel-ai"
          git -C "$RUNNER_TEMP/vercel-ai" remote add origin https://github.com/vercel/ai.git
          git -C "$RUNNER_TEMP/vercel-ai" fetch --depth=1 origin "$commit"

      - name: Validate parity coverage
        env:
          AI_SDK_UPSTREAM_ROOT: ${{ runner.temp }}/vercel-ai
        run: mise run parity-coverage

      - name: Report provider API shape parity
        run: mise run parity-provider-shape

  integration-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          version: "2026.5.4"
          experimental: true

      - name: Resolve Go cache paths
        id: go-cache
        run: |
          echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
          path: |
            ${{ steps.go-cache.outputs.gocache }}
            ${{ steps.go-cache.outputs.gomodcache }}
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('test/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Integration tests
        run: mise run test-integration

  image-validation:
    name: Validate AI Gateway image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: false
          version: "2026.5.4"
          experimental: true

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - name: Build target platforms
        run: >-
          docker buildx build
          --platform linux/amd64,linux/arm64
          --build-arg VCS_REF="$GITHUB_SHA"
          --output "type=oci,dest=$RUNNER_TEMP/ai-gateway.oci"
          ai-gateway

      - name: Build native image
        env:
          AI_GATEWAY_IMAGE: ai-gateway:ci
          AI_GATEWAY_VCS_REF: ${{ github.sha }}
        run: mise run build-ai-gateway-image

      - name: Smoke test native image
        timeout-minutes: 2
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' ai-gateway:ci)" = '10001:10001'
          config="$RUNNER_TEMP/ai-gateway-smoke.yaml"
          printf '%s\n' \
            'providers:' \
            '  smoke:' \
            '    type: anthropic' \
            '    apiKeyEnv: ANTHROPIC_API_KEY' \
            '    baseURL: http://127.0.0.1:1' \
            'models:' \
            '  smoke:' \
            '    name: Smoke test' \
            '    primary:' \
            '      provider: smoke' \
            '      model: smoke' > "$config"
          chmod 644 "$config"
          container=''
          trap '
            if [ -n "$container" ]; then
              docker logs "$container" || true
              docker rm --force "$container" || true
            fi
            rm -f "$config"
          ' EXIT
          container=$(docker run --detach \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,source=$config,target=/etc/gateway/models.yaml,readonly" \
            --env GRAFANA_AI_GATEWAY_CONFIG_FILE=/etc/gateway/models.yaml \
            --env ANTHROPIC_API_KEY=smoke-test-not-a-secret \
            ai-gateway:ci --deployment.mode=development --auth.unsafe \
            --server.listen-address=127.0.0.1:8080)
          for ((attempt = 0; attempt < 30; attempt++)); do
            if docker exec "$container" timeout 2 bash -c '
              exec 3<>/dev/tcp/127.0.0.1/8080
              printf "GET /ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3
              read -r status <&3
              [[ "$status" == *" 200 "* ]]
            '; then
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$container")" != true ]; then
              echo 'AI Gateway exited before becoming ready' >&2
              exit 1
            fi
            sleep 1
          done
          echo 'AI Gateway did not become ready within 30 attempts' >&2
          exit 1

  conformance-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          version: "2026.5.4"
          experimental: true

      - name: Resolve Go cache paths
        id: go-cache
        run: |
          echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
          path: |
            ${{ steps.go-cache.outputs.gocache }}
            ${{ steps.go-cache.outputs.gomodcache }}
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('test/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Conformance tests
        id: conformance
        run: |
          set +e
          mise run test-conformance 2>&1 | tee conformance-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Conformance test summary
        if: always() && steps.conformance.outcome != 'skipped'
        run: |
          PASS=$(grep -c -e "--- PASS:.*/" conformance-output.txt 2>/dev/null || true)
          FAIL=$(grep -c -e "--- FAIL:.*/" conformance-output.txt 2>/dev/null || true)
          PASS=${PASS:-0}
          FAIL=${FAIL:-0}
          echo "## Conformance Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Result: ${PASS} passed, ${FAIL} failed**" >> "$GITHUB_STEP_SUMMARY"
          if [ "$FAIL" -gt 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -e "--- FAIL:.*/" conformance-output.txt >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "${{ steps.conformance.outputs.exit_code }}"

  publish-ai-gateway-image:
    name: Publish AI Gateway image
    if: >-
      ${{ github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/ai-gateway/v')) &&
          github.repository == 'grafana/ai-sdk' }}
    needs:
      - ci
      - docs-lint
      - module-resolution
      - parity-baseline
      - integration-test
      - conformance-test
      - image-validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.image.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Select image tag
        id: image
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            tag="sha-$GITHUB_SHA"
          else
            tag="${GITHUB_REF_NAME#ai-gateway/}"
            if [[ ! "$tag" =~ ^v[0-9][A-Za-z0-9_.-]*$ || ${#tag} -gt 128 ]]; then
              echo "Invalid image tag: $tag" >&2
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish image
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: docker buildx build --platform linux/amd64,linux/arm64 --build-arg "VCS_REF=$GITHUB_SHA" --tag "ghcr.io/grafana/ai-gateway:$IMAGE_TAG" --push ai-gateway

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  deploy-ai-gateway:
    name: Deploy AI Gateway
    if: >-
      ${{ github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          github.repository == 'grafana/ai-sdk' }}
    needs: publish-ai-gateway-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Trigger Argo workflow
        uses: grafana/shared-workflows/actions/trigger-argo-workflow@5a212d56e9d224851dc4b3c2643bbc5bac484d5d # trigger-argo-workflow/v2.0.0
        with:
          instance: ops
          namespace: ai-gateway-cd
          workflow_template: ai-gateway
          parameters: |
            commit=${{ github.sha }}
            commit_author=${{ github.event.head_commit.author.username || github.event.head_commit.author.name }}
            commit_link=${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
            dockertag=${{ needs.publish-ai-gateway-image.outputs.tag }}
