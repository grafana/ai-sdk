name: Build & Test

on:
  push:
    branches: [main]
    tags: ['ai-gateway/v*']
  pull_request:

permissions: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          version: "2026.5.4"
          experimental: true

      - name: Resolve Go cache paths
        id: go-cache
        run: |
          echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
          path: |
            ${{ steps.go-cache.outputs.gocache }}
            ${{ steps.go-cache.outputs.gomodcache }}
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Check formatting
        run: mise run fmt-check

      - name: Validate release configuration
        run: mise run release-check

      - name: Vet
        run: mise run vet

      - name: Lint
        run: mise run lint

      - name: Build
        run: mise run build

      - name: Test
        run: mise run test-short

  docs-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          version: "2026.5.4"
          experimental: true

      - name: Lint docs (structural + markdown style)
        run: mise run lint-docs

  module-resolution:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          version: "2026.5.4"
          experimental: true

      - name: Test module policy fixtures
        run: mise run test-module-policy

      - name: Test CI source and artifact gates
        run: mise run test-ci-workflow

      - name: Verify candidate Gateway workspace
        run: mise run verify-gateway-workspace

      - name: Verify AI Gateway module and license boundary
        run: mise run verify-ai-gateway-boundary

      - name: Verify merged internal module pins
        run: mise run verify-merged-pins

      - name: Verify SDK isolation from Gateway source
        run: mise run verify-sdk-gateway-isolation

  parity-baseline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          version: "2026.5.4"
          experimental: true

      - name: Validate parity baseline
        run: mise run validate-parity-baseline

      - name: Verify ProviderWire V4 contract
        run: mise run test-providerwire-v4

      - name: Fetch pinned upstream fixtures
        run: |
          commit=$(awk '/^  commit:/ { print $2 }' test/conformance/upstream.yaml)
          git init "$RUNNER_TEMP/vercel-ai"
          git -C "$RUNNER_TEMP/vercel-ai" remote add origin https://github.com/vercel/ai.git
          git -C "$RUNNER_TEMP/vercel-ai" fetch --depth=1 origin "$commit"

      - name: Validate parity coverage
        env:
          AI_SDK_UPSTREAM_ROOT: ${{ runner.temp }}/vercel-ai
        run: mise run parity-coverage

      - name: Report provider API shape parity
        run: mise run parity-provider-shape

  integration-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          version: "2026.5.4"
          experimental: true

      - name: Resolve Go cache paths
        id: go-cache
        run: |
          echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
          path: |
            ${{ steps.go-cache.outputs.gocache }}
            ${{ steps.go-cache.outputs.gomodcache }}
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Integration tests
        run: mise run test-integration

  plugin-validation:
    name: Validate AI Gateway plugin
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          version: "2026.5.4"
          experimental: true

      - name: Verify clean plugin source at the artifact revision
        if: ${{ github.event_name == 'push' }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Resolve Go cache paths
        id: go-cache
        run: |
          echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
          path: |
            ${{ steps.go-cache.outputs.gocache }}
            ${{ steps.go-cache.outputs.gomodcache }}
          key: ${{ runner.os }}-go-plugin-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-plugin-
            ${{ runner.os }}-go-

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Verify generated app manifest
        run: |
          mise deps install --only test
          pnpm --filter ./ai-gateway generate:kinds
          test -z "$(git status --porcelain --untracked-files=all -- ai-gateway)"

      - name: Frontend checks
        run: mise run test-ai-gateway-frontend

      - name: Build plugin package
        env:
          AI_GATEWAY_VCS_REF: ${{ github.sha }}
        run: mise run build-ai-gateway-plugin

      - name: Validate plugin package
        run: mise run validate-ai-gateway-plugin

      - name: Plugin end-to-end tests
        env:
          GRAFANA_VERSION: nightly@sha256:5d4bd69f298a7d45b3e14e93d65cd4636cc77619eea120bc1d065662c1b1ceb3
        run: mise run test-ai-gateway-e2e

      - name: Keep the Playwright report of a failed run
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grafana-aigateway-app-playwright-report-${{ github.sha }}
          path: ai-gateway/playwright-report
          if-no-files-found: ignore

      - name: Gateway tests
        run: mise run test-ai-gateway

      - name: Plugin test host suites
        run: mise run test-ai-gateway-command

      - name: Keep validated plugin package
        if: >-
          ${{ github.event_name == 'push' &&
              (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/ai-gateway/v')) &&
              github.repository == 'grafana/ai-sdk' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grafana-aigateway-app-${{ github.sha }}
          path: ai-gateway/dist
          if-no-files-found: error

  conformance-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          version: "2026.5.4"
          experimental: true

      - name: Resolve Go cache paths
        id: go-cache
        run: |
          echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
          path: |
            ${{ steps.go-cache.outputs.gocache }}
            ${{ steps.go-cache.outputs.gomodcache }}
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Conformance tests
        id: conformance
        run: |
          set +e
          mise run test-conformance 2>&1 | tee conformance-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Conformance test summary
        if: always() && steps.conformance.outcome != 'skipped'
        run: |
          PASS=$(grep -c -e "--- PASS:.*/" conformance-output.txt 2>/dev/null || true)
          FAIL=$(grep -c -e "--- FAIL:.*/" conformance-output.txt 2>/dev/null || true)
          PASS=${PASS:-0}
          FAIL=${FAIL:-0}
          echo "## Conformance Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Result: ${PASS} passed, ${FAIL} failed**" >> "$GITHUB_STEP_SUMMARY"
          if [ "$FAIL" -gt 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -e "--- FAIL:.*/" conformance-output.txt >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "${{ steps.conformance.outputs.exit_code }}"
