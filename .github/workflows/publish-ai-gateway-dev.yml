name: Publish AI Gateway plugin (dev)

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ai-gateway-dev-publish
  cancel-in-progress: false

jobs:
  source-ci:
    name: Wait for source CI and plugin validation
    if: ${{ github.repository == 'grafana/ai-sdk' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: "2026.5.4"
          install_args: node
          experimental: true

      - name: Install locked release tooling
        run: npm ci --prefix release/tooling --ignore-scripts

      - name: Require successful source CI for this commit
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: node release/tooling/gateway-publication-gate.mjs

  publish:
    name: Publish AI Gateway plugin to the dev catalog
    needs: source-ci
    permissions:
      contents: write
      id-token: write
      attestations: write
      pull-requests: read
    uses: grafana/plugin-ci-workflows/.github/workflows/cd.yml@ci-cd-workflows/v12.0.1
    with:
      branch: ${{ github.sha }}
      environment: dev
      scopes: grafana_cloud
      plugin-directory: ai-gateway
      plugin-version-suffix: ${{ github.sha }}
      backend-build-target: buildPlugin
      golangci-lint-version: "2.15.0"
      run-plugin-validator: true
      run-playwright: false
      trigger-argo: false

  update-plugin-version:
    name: Pin the published version in dev
    needs: publish
    if: ${{ github.repository == 'grafana/ai-sdk' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to GAR
        uses: grafana/shared-workflows/actions/login-to-gar@afad5c7621e788905e6417f05b492972685ab1eb # login-to-gar/v1.0.4

      - name: Generate GitHub token
        id: generate-token
        uses: grafana/shared-workflows/actions/create-github-app-token@5bbb526b1728ca57fbe1750c4c27ab6ab06171c2 # create-github-app-token/v1.0.0
        with:
          github_app: updater-for-ci
          permission_set: deploy

      - name: Open the dev version pin pull request
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          PLUGIN_VERSION: ${{ fromJSON(needs.publish.outputs.plugin).version }}
        run: |
          set -euo pipefail
          if [[ "$PLUGIN_VERSION" != ?*"+$GITHUB_SHA" ]]; then
            echo "::error::published version '$PLUGIN_VERSION' does not end in +$GITHUB_SHA"
            exit 1
          fi
          config=$(jq -n \
            --arg version "$PLUGIN_VERSION" \
            --arg msg "Created by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This PR will auto-merge once CI has passed." \
            '{
              pull_request_branch_prefix: "auto-merge/updater/grafana-aigateway-app/dev",
              pull_request_enabled: true,
              pull_request_existing_strategy: "replace",
              pull_request_message: $msg,
              update_jsonnet_attribute_configs: [{
                file_path: "ksonnet/environments/appplugins/grafana-aigateway-app/versions.libsonnet",
                jsonnet_key: "dev",
                jsonnet_value: $version
              }]
            }')
          docker run --rm -e GITHUB_TOKEN -e CONFIG_JSON="$config" \
            us-docker.pkg.dev/grafanalabs-global/docker-deployment-tools-prod/updater
