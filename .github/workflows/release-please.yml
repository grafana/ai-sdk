name: Release

# Inactive scaffold. #245 will complete artifact readiness and Gateway release
# attribution before enabling this workflow on main. A manual dispatch also
# skips the job, so merging #21 cannot create release PRs, tags, or releases.
on:
  workflow_dispatch:

permissions: {}

# Two runs grooming the same release branches race each other into a
# non-fast-forward push. Never cancel: a cancelled run can leave a release
# branch updated without its pull request refreshed.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: ${{ false }} # Activation belongs to #245.
    runs-on: ubuntu-latest
    permissions:
      id-token: write # mint the release app token through Vault
    steps:
      # The default GITHUB_TOKEN cannot trigger the required checks on the pull
      # requests release-please opens, so a release pull request could never
      # satisfy branch protection. A GitHub App token can.
      #
      # The token is brokered by Vault against this workflow's OIDC identity, so
      # no app private key lives in this repository. The broker binds issuance to
      # this file's path, the main branch, and the push event; moving or renaming
      # this workflow requires coordinating an update to the external broker configuration.
      - name: Mint release app token
        id: app-token
        uses: grafana/shared-workflows/actions/create-github-app-token@5bbb526b1728ca57fbe1750c4c27ab6ab06171c2 # create-github-app-token/v1.0
        with:
          github_app: grafana-ai-sdk-release

      - name: Prepare release pull requests (enabled by #245)
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          skip-github-release: true
