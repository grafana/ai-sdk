name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: ${{ github.repository == 'grafana/ai-sdk' && github.event_name == 'push' && github.ref == 'refs/heads/main' && (vars.RELEASE_LIBRARY_MODE == 'root' || vars.RELEASE_LIBRARY_MODE == 'libraries') }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: "2026.5.4"
          install_args: node go python pnpm
          experimental: true

      - name: Install and test locked release tooling
        run: |
          npm ci --prefix release/tooling --ignore-scripts
          npm test --prefix release/tooling

      - name: Mint release App token
        id: app-token
        uses: grafana/shared-workflows/actions/create-github-app-token@5bbb526b1728ca57fbe1750c4c27ab6ab06171c2 # create-github-app-token/v1.0
        with:
          github_app: grafana-ai-sdk-release

      - name: Validate and release selected libraries
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_READ_TOKEN: ${{ github.token }}
          RELEASE_LIBRARY_MODE: ${{ vars.RELEASE_LIBRARY_MODE }}
          RELEASE_TAG_RULESET: ${{ vars.RELEASE_TAG_RULESET }}
        run: node release/tooling/publish.mjs
