name: Release readiness

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions: {}

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: "2026.5.4"
          experimental: true

      - name: Read live release candidate metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh api "repos/grafana/ai-sdk/pulls/$PR_NUMBER" > "$RUNNER_TEMP/release-pr.json"

      - name: Validate selected library publication readiness
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_readiness.py --pull-request "$RUNNER_TEMP/release-pr.json" --evidence "$RUNNER_TEMP/library-readiness.json"

      - name: Retain validated library candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: library-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/library-readiness.json
          if-no-files-found: ignore
          retention-days: 90
