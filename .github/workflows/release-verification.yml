name: Release verification

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Library release tag to verify, for example providers/openai/v0.1.0-alpha.2
        required: true
        type: string

permissions: {}

concurrency:
  group: release-verification-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  verify-published-library:
    if: ${{ github.repository == 'grafana/ai-sdk' && !startsWith(github.event.release.tag_name || inputs.tag, 'ai-gateway/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          cache: false
          version: "2026.5.4"
          install_args: node go python pnpm
          experimental: true

      - name: Verify the published library through the public Go proxy
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python3 scripts/release_consumer.py "$RELEASE_TAG" --wait-minutes 40
