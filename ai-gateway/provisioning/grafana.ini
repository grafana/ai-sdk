; Local development settings, loaded by docker-compose.yaml through
; GF_PATHS_CONFIG. Grafana passes each key of the plugin section to the plugin
; as GF_PLUGIN_<KEY>. Grafana reads the model catalog file into model_catalog;
; the catalog reads the provider key from GF_PLUGIN_ANTHROPIC_API_KEY.
[feature_toggles]
appplugins.loadAppManifest = true
appplugins.registerAPIServer = true
grafana.useRouterMiddleware = true

[plugin.grafana-aigateway-app]
model_catalog = $__file{/etc/grafana/provisioning/aigateway/models.yaml}
access_mode = self-hosted
anthropic_api_key = $__env{ANTHROPIC_API_KEY}
