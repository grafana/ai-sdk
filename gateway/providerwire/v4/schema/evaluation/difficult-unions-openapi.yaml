openapi: 3.1.0
info:
  title: ProviderWire V4 generator evaluation corpus
  version: 1.0.0
paths: {}
components:
  schemas:
    GeneratorDifficultUnionCorpus:
      type: object
      properties:
        message:
          oneOf:
            - $ref: '#/components/schemas/SystemMessage'
            - $ref: '#/components/schemas/UserMessage'
        tool:
          oneOf:
            - $ref: '#/components/schemas/FunctionTool'
            - $ref: '#/components/schemas/ProviderTool'
        file:
          oneOf:
            - $ref: '#/components/schemas/DataFile'
            - $ref: '#/components/schemas/URLFile'
        optionalFalse:
          type: boolean
        explicitEmpty:
          type: array
          items:
            type: string
        nullableOpaque: {}
        nonNullOpaque:
          not:
            type: 'null'
        keyedObjects:
          type: object
          additionalProperties:
            type: object
            additionalProperties: true
      required: [message, tool, file, nullableOpaque, nonNullOpaque, keyedObjects]
      additionalProperties: false
    SystemMessage:
      type: object
      properties:
        role:
          type: string
          const: system
        content:
          type: string
      required: [role, content]
      additionalProperties: false
    UserMessage:
      type: object
      properties:
        role:
          type: string
          const: user
        content:
          type: array
          items:
            type: string
      required: [role, content]
      additionalProperties: false
    FunctionTool:
      type: object
      properties:
        type:
          type: string
          const: function
        name:
          type: string
        strict:
          type: boolean
      required: [type, name]
      additionalProperties: false
    ProviderTool:
      type: object
      properties:
        type:
          type: string
          const: provider
        id:
          type: string
        args:
          type: object
          additionalProperties: true
      required: [type, id, args]
      additionalProperties: false
    DataFile:
      type: object
      properties:
        type:
          type: string
          const: data
        data:
          type: string
      required: [type, data]
      additionalProperties: false
    URLFile:
      type: object
      properties:
        type:
          type: string
          const: url
        url:
          type: string
      required: [type, url]
      additionalProperties: false
