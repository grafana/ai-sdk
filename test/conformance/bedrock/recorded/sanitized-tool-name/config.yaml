model: us.anthropic.claude-haiku-4-5-20251001-v1:0
prompt: Continue after a hallucinated tool call name.
messages:
  - role: assistant
    content:
      - type: tool-call
        toolCallId: call-1
        toolName: $READFILE
        input: {}
  - role: tool
    content:
      - type: tool-result
        toolCallId: call-1
        toolName: $READFILE
        output:
          type: json
          value:
            content: file contents
  - role: user
    content: Continue.
tools:
  READFILE:
    description: Read a file.
    inputSchema:
      type: object
      additionalProperties: false
