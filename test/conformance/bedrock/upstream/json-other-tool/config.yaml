# converter emits the regular tool-call for the user tool and collapses the
# json tool into text.
model: anthropic.claude-3-haiku-20240307-v1:0
stopWhenStepCount: 1
responseFormat:
  type: json
  schema:
    type: object
    properties:
      answer:
        type: string
