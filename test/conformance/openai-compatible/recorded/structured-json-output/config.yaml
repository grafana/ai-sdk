# Structured JSON stream in OpenAI-compatible Chat Completions format.
model: gpt-4.1-mini
prompt: "Return a status JSON object with status ok and count 2."
responseFormat:
  type: json
  name: status_response
  description: Status response.
  schema:
    type: object
    properties:
      status:
        type: string
      count:
        type: number
    required: [status, count]
    additionalProperties: false
