# Tool-call stream in OpenAI-compatible Chat Completions format.
model: gpt-4.1-mini
prompt: "What is the weather in Berlin? Use the get_weather tool."
stopWhenStepCount: 1
tools:
  get_weather:
    description: Get the current weather for a city.
    strict: false
    inputSchema:
      type: object
      properties:
        city:
          type: string
      required: [city]
