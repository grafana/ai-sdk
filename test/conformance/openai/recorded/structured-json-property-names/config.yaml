model: gpt-4.1-mini
prompt: 'Return the object {"STATUS":"ready","DETAIL":{"CODE":"GREEN"}}.'
maxRetries: 0
stopWhenStepCount: 1
providerOptions:
  openai:
    store: false
responseFormat:
  type: json
  name: status_report
  schema:
    type: object
    propertyNames:
      type: string
      pattern: '^[A-Z]+$'
    properties:
      STATUS:
        type: string
        enum: [ready]
      DETAIL:
        type: object
        propertyNames:
          type: string
          pattern: '^[A-Z]+$'
        properties:
          CODE:
            type: string
            enum: [GREEN]
        required: [CODE]
        additionalProperties: false
    required: [STATUS, DETAIL]
    additionalProperties: false
assertOutputValue: true
