model: gpt-4.1-mini
prompt: >-
  Call get_weather once for San Francisco. The report contains a text label, an
  image, and a PDF. Return the text code, the color of the square in the image,
  and the PDF code, in that order, separated by commas.
maxRetries: 0
stopWhenStepCount: 2
providerOptions:
  openai:
    store: false
    parallelToolCalls: false
tools:
  get_weather:
    description: Get the weather report attachments for a city.
    inputSchema:
      type: object
      properties:
        location:
          type: string
      required: [location]
      additionalProperties: false
    mockResults:
      - attachments: [text, image, pdf]
    modelOutput:
      type: content
      content:
        - type: text
          text: 'Text code: MAPLE'
        - type: file-data
          data: iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAIAAADYYG7QAAAAQUlEQVR4nO3OQQ0AMBAEofNvupWx8yBBAHf3YvYDISEhoZj9QEhISChmPxASEhKK2Q+EhISEYvYDISEhoZj9oB368AX3eWaj93YAAAAASUVORK5CYII=
          mediaType: image/png
        - type: file-data
          filename: report.pdf
          data: 
          mediaType: application/pdf
