upstream:
  repository: https://github.com/vercel/ai
  commit: d440c9de912e3f450e9aa8fc52a97517ee06ebd3
  packageSource: npm
  verifiedAt: "2026-08-10"
packages:
  ai: 7.0.56
  "@ai-sdk/anthropic": 4.0.34
  "@ai-sdk/amazon-bedrock": 5.0.48
  "@ai-sdk/gateway": 4.0.44
  "@ai-sdk/openai": 4.0.34
  "@ai-sdk/openai-compatible": 3.0.25
  "@ai-sdk/provider": 4.0.6
  "@ai-sdk/provider-utils": 5.0.23
  "@ai-sdk/react": 4.0.59
verification:
  status: enforced
  conformanceScope: full
  commands:
    parityCheck: mise run parity-check
    conformance: mise run test-conformance
    regenerate: mise run generate-conformance
knownGaps:
  - id: anthropic-base-url-normalization
    surface: provider-anthropic
    status: gap
    description: Upstream @ai-sdk/anthropic normalizes a bare https://api.anthropic.com
      base URL to include /v1. The Go provider currently exposes raw anthropic-sdk-go
      request options rather than a first-class TypeScript-compatible base URL
      setting, so this provider configuration behavior is not parity-covered.
  - id: openai-base-url-validation
    surface: provider-openai
    status: gap
    description: Upstream @ai-sdk/openai rejects empty explicit and environment-derived
      base URLs during provider creation. The Go provider exposes raw openai-go request
      options through an error-free constructor, so invalid base URLs fail later when
      a request is made rather than at construction time.
  - id: bedrock-anthropic-invoke-surface
    surface: provider-bedrock
    status: gap
    description: Upstream @ai-sdk/amazon-bedrock exposes a separate Anthropic Invoke
      provider that translates eager_input_streaming into the fine-grained tool
      streaming beta. The Go Bedrock provider currently implements only the Converse
      and ConverseStream APIs, so that provider surface and behavior are not exposed.
  - id: transcription-model-surface
    surface: provider-contract
    status: gap
    description: Upstream provider v4 includes transcription models, including
      experimental streaming transcription in the current registered baseline. The
      Go port currently scopes provider parity to LanguageModel surfaces and does
      not expose transcription model APIs or conformance coverage.
  - id: image-model-surface
    surface: provider-contract
    status: gap
    description: Upstream provider v4 and registered provider packages include image
      model APIs and provider-specific image options. The Go port currently scopes
      provider parity to LanguageModel surfaces and does not expose image model APIs
      or conformance coverage.
  - id: video-model-surface
    surface: provider-contract
    status: gap
    description: Upstream provider v4 and ai expose video model APIs, including
      asynchronous start/status operations, polling, and webhook completion in the
      current registered baseline. The Go port currently scopes provider parity to
      LanguageModel surfaces and does not expose video model APIs or conformance
      coverage.
  - id: speech-translation-model-surface
    surface: provider-contract
    status: gap
    description: Upstream provider v4 and ai expose the experimental streaming speech
      translation model contract and orchestration, and the registered OpenAI package
      exposes a realtime translation model. The Go port currently scopes provider
      parity to LanguageModel surfaces and does not expose speech translation models,
      stream orchestration, realtime translation transport, or conformance coverage.
  - id: batch-language-model-surface
    surface: provider-contract
    status: gap
    description: Upstream provider v4 exposes optional language-model batch submission
      and ai exposes batch orchestration, with Anthropic and OpenAI implementations in
      the registered baseline. The Go LanguageModel contract and providers currently
      expose only synchronous generate and stream calls, without batch APIs or
      conformance coverage.
  - id: structured-output-repair-text
    surface: core-orchestration
    status: gap
    description: Upstream ai exposes stable repairText callbacks on its legacy
      generateObject and streamObject APIs. The Go port uses the Output abstraction
      and typed output wrappers and does not currently expose a repair callback for
      invalid-but-repairable structured output.
